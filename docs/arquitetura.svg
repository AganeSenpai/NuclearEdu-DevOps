<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">NuclearEdu - Arquitetura da implantacao Azure e Docker</title>
<desc id="desc">Navegador acessa IP publico da VM; NSG permite TCP 5000; VM Ubuntu na rede virtual hospeda Docker Engine e API Flask Gunicorn. Azure CLI provisiona a VM e Azure Run Command instala Docker e implanta o codigo. Sem banco de dados.</desc>
